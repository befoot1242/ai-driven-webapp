spring:
  application:
    name: backend
  datasource:
    # ローカルは compose.yaml の PostgreSQL。本番は環境変数（Secrets Manager 経由）で渡す
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
