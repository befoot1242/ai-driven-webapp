openapi: 3.1.0
info:
  title: AI Driven Web App API
  version: 0.1.0
  description: API 契約の正本。変更は基本設計（BD）が approved になってから行う。
servers:
  - url: http://localhost:8080
paths:
  /api/notices:
    get:
      operationId: listNotices
      summary: 公開済みお知らせの一覧
      description: "@trace BD-001"
      tags: [notice]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticePage" }
        "400":
          description: パラメータ不正
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Notice:
      type: object
      required: [id, title, publishedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, maxLength: 200 }
        publishedAt: { type: string, format: date-time }
    NoticePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notice" }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Problem:
      description: RFC 9457 Problem Details
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
